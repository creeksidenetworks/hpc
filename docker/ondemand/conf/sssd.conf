# sssd.conf — SSSD configuration for FreeIPA / LDAP authentication
# File must be owned by root, mode 0600
# Reference: https://sssd.io/docs/

[sssd]
services = nss, pam, sudo
domains = csn.corp
config_file_version = 2

# ----- IPA domain -----
[domain/csn.corp]
id_provider     = ipa
auth_provider   = ipa
access_provider = ipa
chpass_provider = ipa

ipa_domain  = csn.corp
ipa_server  = ipa1.csn.corp

dns_discovery_domain = csn.corp

ldap_schema             = ipa
ldap_user_object_class  = posixAccount
ldap_group_object_class = posixGroup

override_homedir = /home/%u

cache_credentials              = True
krb5_store_password_if_offline = True
enumerate                      = False

ldap_tls_reqcert = demand
ldap_tls_cacert  = /etc/ipa/ca.crt

debug_level = 0
