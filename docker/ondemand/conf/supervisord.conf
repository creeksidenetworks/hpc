[supervisord]
nodaemon=true
logfile=/var/log/ondemand/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/var/run/ondemand-supervisord.pid
user=root

[unix_http_server]
file=/var/run/ondemand-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/ondemand-supervisor.sock

# ----- munge (needed for Slurm job submission) -----
[program:munge]
command=/usr/sbin/munged --foreground --force
user=munge
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/ondemand/munge.log
stderr_logfile=/var/log/ondemand/munge.log
startretries=3

# ----- sssd (IPA user/group resolution and PAM auth) -----
[program:sssd]
command=/usr/sbin/sssd -i -c /etc/sssd/sssd.conf
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/ondemand/sssd.log
stderr_logfile=/var/log/ondemand/sssd.log
startretries=3

# ----- httpd (Apache — serves OOD on ports 80/443/4443) -----
[program:httpd]
command=/usr/sbin/httpd -DFOREGROUND
user=root
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/ondemand/httpd.log
stderr_logfile=/var/log/ondemand/httpd.log
startretries=5
startsecs=5
