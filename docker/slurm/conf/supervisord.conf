[supervisord]
nodaemon=true
logfile=/var/log/slurm/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/var/run/slurm/supervisord.pid
user=root

[unix_http_server]
file=/var/run/slurm/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/slurm/supervisor.sock

# ----- munge -----
[program:munge]
command=/usr/sbin/munged --foreground --force
user=munge
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/slurm/munge.log
stderr_logfile=/var/log/slurm/munge.log
startretries=3

# ----- sssd -----
[program:sssd]
command=/usr/sbin/sssd -i -c /etc/sssd/sssd.conf
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/slurm/sssd.log
stderr_logfile=/var/log/slurm/sssd.log
startretries=3

# ----- slurmdbd -----
[program:slurmdbd]
command=/usr/sbin/slurmdbd -D
user=slurm
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/slurm/slurmdbd-sup.log
stderr_logfile=/var/log/slurm/slurmdbd-sup.log
startretries=5
startsecs=5

# ----- slurmctld -----
[program:slurmctld]
command=/usr/sbin/slurmctld -D
user=slurm
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/slurm/slurmctld-sup.log
stderr_logfile=/var/log/slurm/slurmctld-sup.log
startretries=5
startsecs=10

# ----- crond (runs ipa-slurm-sync every 10 min) -----
[program:crond]
command=/usr/sbin/crond -n
user=root
autostart=true
autorestart=true
priority=50
stdout_logfile=/var/log/slurm/crond.log
stderr_logfile=/var/log/slurm/crond.log
startretries=3
