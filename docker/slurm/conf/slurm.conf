# slurm.conf — Slurm controller configuration
# Reference: https://slurm.schedmd.com/slurm.conf.html

# ----- Identity -----
ClusterName=hpc
SlurmctldHost=slurmctld

# ----- Authentication -----
AuthType=auth/munge
CryptoType=crypto/munge

# ----- Ports -----
SlurmctldPort=6817
SlurmdPort=6818

# ----- Paths -----
SlurmUser=slurm
SlurmdUser=root
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
StateSaveLocation=/var/spool/slurm/ctld
SlurmdSpoolDir=/var/spool/slurm/d

# ----- Scheduling -----
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# ----- Accounting -----
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmctld
AccountingStoragePort=6819
# AccountingStorageEnforce intentionally omitted — slurmctld would fatally exit
# if slurmdbd is not ready at startup when associations is set.
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30

# ----- Logging -----
SlurmctldDebug=info
SlurmdDebug=info

# ----- Nodes -----
# Add your compute nodes here, e.g.:
# NodeName=cpn[01-04] CPUs=8 RealMemory=32000 State=UNKNOWN
NodeName=localhost CPUs=1 RealMemory=1000 State=UNKNOWN

# ----- Partitions -----
PartitionName=compute \
    Nodes=ALL \
    Default=YES \
    MaxTime=5-00:00:00 \
    DefaultTime=5-00:00:00 \
    MaxMemPerCPU=500 \
    OverSubscribe=NO \
    State=UP
